  .card h1 { margin:0 0 6px; font-size:24px; } .card p { margin:6px 0 14px; color:#6f6455; }
  .stack { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .notes { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; text-align:left; margin:10px 0; }
  .note { padding:10px; border-radius:6px; font-size:14px; box-shadow:0 2px 4px rgba(0,0,0,.12); word-break:break-all; } .note small { display:block; color:#6f6455; margin-top:6px; }
  #zoom img { max-width:min(92vw,1400px); max-height:78vh; border:10px solid #fff; box-shadow:0 10px 40px rgba(0,0,0,.5); background:#fff; }
  #zoom .cap { color:#fff; margin-top:14px; text-align:center; font-size:17px; } #zoom .cap small { display:block; opacity:.75; margin-top:4px; }
  #photo img { max-width:min(92vw,1100px); max-height:66vh; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  #count { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:120px; font-weight:900; color:#fff; text-shadow:0 4px 20px rgba(0,0,0,.5); pointer-events:none; z-index:15; }
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .5s; z-index:16; }
  #toast { position:fixed; top:64px; left:50%; transform:translate(-50%,-20px); opacity:0; transition:.3s; background:rgba(30,30,30,.9); color:#fff; padding:10px 16px; border-radius:12px; font-weight:700; pointer-events:none; z-index:30; text-align:center; max-width:90%; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  .hide { display:none !important; }
  .gticket { position:relative; margin:12px auto; padding:26px 22px; max-width:340px; background:linear-gradient(135deg,#fde6ec,#f5c4d4); color:#e2475a; border:2px solid #e2475a; outline:1px solid #e2475a; outline-offset:-9px; border-radius:6px; text-align:center; }
  .gticket .sm { font-size:11px; letter-spacing:.35em; }
  .gticket .big { font-size:34px; font-weight:800; letter-spacing:.06em; margin:8px 0; }
  .gticket .ln { display:flex; align-items:center; gap:6px; justify-content:center; margin:6px 0; } .gticket .ln i { height:1px; width:70px; background:#e2475a; display:block; } .gticket .ln b { font-size:9px; }
  .gticket .who { color:#9b2335; font-weight:700; margin-top:8px; }
  .gticket::before, .gticket::after { content:"❦"; position:absolute; top:4px; font-size:16px; } .gticket::before { left:8px; } .gticket::after { right:8px; transform:scaleX(-1); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const $ = id => document.getElementById(id);
$('enterNote').textContent = (ONLINE ? '' : '혼자 테스트 모드 · ') + '방: ' + ROOM;
$('toCinema').href = 'cinema.html' + location.search; $('toHome').href = './' + location.search;
try { $('nameIn').value = localStorage.getItem('oname') || ''; } catch {}
scene.background = new THREE.Color(0xf3eee6);
hemi.intensity = 1.0; sun.intensity = 0.35;
const today = new Date().toLocaleDateString('ko-KR');

// ── 전시장 짓기: 분홍 벽·민트 장식의 호텔풍 전시실 (천장 없이 하늘) ──
// 기둥 사이 한 칸 = 작가 두 명(왼쪽 벽·오른쪽 벽). 들어가자마자 첫 칸은 비워 두고 다음 칸부터 걸어요.
const W = 13, zF = 12, LOBBY = zF - 10; // 입구 로비(리셉션·꽃다발·포토존) 뒤에 리본
const ARTIST_SPOTS = 20; // 작품이 아직 없어도 작가 20명 자리를 늘 만들어 둬요
const HW = 10.5, BAY = 24, DOOR = 3, zH = LOBBY - 0.5, WALL_H = 9, S = 1.7; // 전시실 반폭, 섹션 길이, 입구 반폭, 벽 높이, 작품 크기 배율
const PINK = 0xf6d9e3, LAVENDER = 0xc9b8e0, MINT = 0x9cc9b0, MINT_D = 0x6fa58b, CREAM = 0xfbf1e1, GOLD = 0xd4a843, RED = 0xc0392b;
let arts = [], settings = {}, artMeshes = [], floors = [], slots = [], H = null, taps = [], ZONES = [], benches = [];
// 한 벽의 자리: [벽 따라 위치, 높이, 최대 가로, 최대 세로] (S배로 커져요). 0번이 가운데(가장 큼)
const LAYOUT = [[0, 2.75, 2.7, 2.6],
  [-2.5, 3.6, 1.6, 1.45], [2.5, 3.6, 1.6, 1.45], [-2.5, 1.8, 1.6, 1.25], [2.5, 1.8, 1.6, 1.25],
  [-3.95, 2.7, 0.85, 1.05], [3.95, 2.7, 0.85, 1.05], [0, 4.6, 1.5, 0.6],
  [-3.95, 4.0, 0.85, 0.75], [3.95, 4.0, 0.85, 0.75], [-3.95, 1.45, 0.85, 0.75], [3.95, 1.45, 0.85, 0.75]];

const galleryName = () => (settings.gallery_name || '').trim() || '우리반 미술관';
function signTex(w, h, draw) { return new THREE.MeshBasicMaterial({ map: canvasTex(w, h, draw) }); }
function texRepeat(t, rx, ry) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t; }
function plane(w, h, m, x, y, z, ry = 0) { const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); p.position.set(x, y, z); p.rotation.y = ry; scene.add(p); return p; }

function groupWalls(list) { // 작가별로 묶고, 이모티콘을 맨 앞(가운데 자리)으로
  const by = new Map(); for (const a of list) { const k = (a.artist || '').trim(); if (!by.has(k)) by.set(k, []); by.get(k).push(a); }
  const rank = a => a.kind === 'emoticon' ? 0 : a.kind === 'stock' ? (a.size === '큰' ? 1 : 2) : ({ 큰: 1, 보통: 2, 작은: 3 }[a.size] || 2);
  const walls = [];
  for (const [artist, items] of by) {
    const s = items.slice().sort((x, y) => rank(x) - rank(y));
    for (let i = 0; i < s.length; i += LAYOUT.length) walls.push({ artist, items: s.slice(i, i + LAYOUT.length) });
  }
  return walls;
}

function buildHall(list) {
  const walls = groupWalls(list), nBay = Math.ceil(Math.max(ARTIST_SPOTS, walls.length) / 2) + 1, D = nBay * BAY, zB = zH - D;
  scene.background = new THREE.Color(0xbfe3f5); hemi.intensity = 1.15; // 천장 없이 하늘
  // 바닥: 로비는 아르데코 무늬, 전시실은 분홍·크림 체크
  const lf = new THREE.Mesh(box(2 * W + 1, 0.2, zF - zH + 0.6), new THREE.MeshLambertMaterial({ map: canvasTex(520, 220, (g, w, h) => {
    const c = ['#f2a7a3', '#fbf1e1', '#e9b949', '#9cc9b0', '#e8837c'];
    for (let i = -6; i < 16; i++) { g.fillStyle = c[(i + 6) % 5]; g.beginPath(); g.moveTo(w / 2 + i * 40 - 40, h); g.lineTo(w / 2 + i * 40, h); g.lineTo(w / 2 + i * 40 - 160, 0); g.lineTo(w / 2 + i * 40 - 200, 0); g.fill(); }
    g.save(); g.scale(-1, 1); g.translate(-w, 0); g.globalAlpha = 0.5;
    for (let i = -6; i < 16; i += 2) { g.fillStyle = c[(i + 8) % 5]; g.beginPath(); g.moveTo(w / 2 + i * 40 - 40, h); g.lineTo(w / 2 + i * 40, h); g.lineTo(w / 2 + i * 40 - 160, 0); g.lineTo(w / 2 + i * 40 - 200, 0); g.fill(); }
    g.restore(); g.strokeStyle = '#3d5a4c'; g.lineWidth = 4; g.strokeRect(10, 10, w - 20, h - 20);
  }) }));
  lf.position.set(0, -0.1, (zF + zH) / 2 + 0.3); scene.add(lf); floors.push(lf);
  const fl = new THREE.Mesh(box(2 * HW, 0.2, D), new THREE.MeshLambertMaterial({ map: texRepeat(canvasTex(128, 128, (g, w, h) => {
    g.fillStyle = '#fbe3df'; g.fillRect(0, 0, w, h); g.fillStyle = '#e98f8f';
    for (const [x, y] of [[0, 0], [64, 64], [128, 0], [0, 128], [128, 128]]) { g.beginPath(); g.moveTo(x, y - 32); g.lineTo(x + 32, y); g.lineTo(x, y + 32); g.lineTo(x - 32, y); g.fill(); }
  }), HW / 1.5, D / 3) }));
  fl.position.set(0, -0.1, zH - D / 2); scene.add(fl); floors.push(fl);
  block(3, 0.04, D - 2, 0xa8232f, 0, 0.02, zH - D / 2); // 가운데 붉은 카펫
  const w = (x, z, sx, sz, h, c) => { const o = new THREE.Mesh(box(sx, h, sz), mat(c)); o.position.set(x, h / 2, z); scene.add(o); return o; };
  // 로비 벽 + 전시실 입구 (민트 아치)
  w(-W - 0.15, (zF + 0.45 + zH) / 2, 0.3, zF + 0.45 - zH, WALL_H, PINK); w(W + 0.15, (zF + 0.45 + zH) / 2, 0.3, zF + 0.45 - zH, WALL_H, PINK);
  w(-(W + DOOR) / 2, zH, W - DOOR, 0.4, WALL_H, PINK); w((W + DOOR) / 2, zH, W - DOOR, 0.4, WALL_H, PINK);
  for (const s of [-1, 1]) { block(0.12, 1.2, zF + 0.3 - zH, MINT, s * (W - 0.02), 0.6, (zF + 0.3 + zH) / 2); block(W - DOOR, 1.2, 0.12, MINT, s * (W + DOOR) / 2, 0.6, zH + 0.22); }
  arch(0, zH + 0.05, DOOR, 4.6, WALL_H - 1.2, MINT, 0.8, true); block(2 * DOOR + 0.8, 1.2, 0.5, PINK, 0, WALL_H - 0.6, zH);
  const nameSign = plane(5.4, 0.9, signTex(600, 100, (c, w2, h) => { c.fillStyle = '#9cc9b0'; c.fillRect(0, 0, w2, h); c.strokeStyle = '#d4a843'; c.lineWidth = 6; c.strokeRect(6, 6, w2 - 12, h - 12); c.fillStyle = '#7a1f2b'; c.font = `bold 46px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(`✦ ${galleryName()} ✦`, w2 / 2, h / 2 + 2, w2 - 30); }), 0, WALL_H - 0.6, zH + 0.27);
  { const fw = new THREE.Mesh(new THREE.PlaneGeometry(2 * W + 0.6, WALL_H), new THREE.MeshLambertMaterial({ color: PINK })); fw.rotation.y = Math.PI; fw.position.set(0, WALL_H / 2, zF + 0.3); scene.add(fw);
    const fm = new THREE.Mesh(new THREE.PlaneGeometry(2 * W + 0.6, 1.2), new THREE.MeshLambertMaterial({ color: MINT })); fm.rotation.y = Math.PI; fm.position.set(0, 0.6, zF + 0.28); scene.add(fm); }
  // 전시실 벽: 분홍 + 아래 민트 판넬 + 위 민트 몰딩
  for (const s of [-1, 1]) {
    w(s * (HW + 0.15), zH - D / 2, 0.3, D, WALL_H, PINK);
    block(0.12, 1.6, D, MINT, s * (HW - 0.02), 0.8, zH - D / 2); block(0.16, 0.12, D, MINT_D, s * (HW - 0.04), 1.62, zH - D / 2);
    block(0.4, 0.35, D, MINT, s * (HW - 0.15), WALL_H - 0.18, zH - D / 2);
  }
  w(0, zB - 0.15, 2 * HW + 0.6, 0.3, WALL_H, PINK); // 끝 벽: 포스트잇 방명록
  block(11, 6.4, 0.2, MINT, 0, 4.0, zB + 0.05); block(11.4, 0.3, 0.4, GOLD, 0, 7.25, zB + 0.1); block(11.4, 0.3, 0.4, GOLD, 0, 0.75, zB + 0.1);
  gbBoard = plane(10.4, 5.8, new THREE.MeshBasicMaterial({ color: 0xffffff }), 0, 4.0, zB + 0.17);
  gbBoard.userData.tap = 'guestbook'; taps.push(gbBoard); drawBoard(gbRows);
  benches = [];
  // 칸마다: 민트 기둥과 아치, 가운데 장식(청록 소파 / 아기천사 조각)
  for (let b = 0; b <= nBay; b++) {
    const z = zH - b * BAY;
    if (b > 0 && b < nBay) { for (const s of [-1, 1]) pilaster(s * (HW - 0.45), z); arch(0, z, HW - 0.45, 6.6, WALL_H - 0.2, MINT, 0.9, false); }
    if (b === nBay) continue;
    const zc = z - BAY / 2;
    if (b % 2) sofa(0, zc); else { bench(-0.6, zc, 1); bench(0.6, zc, -1); }
  }
  // 작가 벽 걸기: 첫 칸(b=0)은 건너뛰어요
  slots = []; ZONES = [LOBBY_ZONE];
  const used = new Set();
  walls.forEach((wl, k) => {
    const bay = Math.floor(k / 2) + 1, side = k % 2 ? 1 : -1, nx = -side, zc = zH - bay * BAY - BAY / 2, wx = side * HW; used.add(bay + ':' + side);
    wl.items.forEach((a, i) => { const [off, y, mw, mh] = LAYOUT[i]; slots.push({ a, x: wx + nx * 0.02, z: zc + off * S * side, nx, nz: 0, y: y * S, w: mw * S, h: mh * S, main: i === 0 }); });
    plaque(wl, wx + nx * 0.03, zc, nx);
    bench(side * (HW - 6.0), zc, nx);
    ZONES.push({ x1: Math.min(wx + nx * 0.8, wx + nx * 4.8), x2: Math.max(wx + nx * 0.8, wx + nx * 4.8), z1: zc - 7, z2: zc + 7, title: `${wl.artist} 작가 섹션`,
      cam: { pos: new THREE.Vector3(wx + nx * 17, 4.4, zc), look: new THREE.Vector3(wx, 4.2, zc) } });
  });
  for (let b = 0; b < nBay; b++) for (const side of [-1, 1]) if (!used.has(b + ':' + side)) decorWall(side * HW, zH - b * BAY - BAY / 2, -side);
  ceiling(0, zH - D / 2, 2 * HW, D); ceiling(0, (zF + zH) / 2 + 0.3, 2 * W, zF - zH + 0.6);
  for (let b = 0; b < nBay; b++) chandelier(0, zH - b * BAY - BAY / 2);
  chandelier(0, (zF + zH) / 2, 0.8);
  slots.forEach(hang);
  buildLobby();
  return { zF, zB };
}
// 천장: 연보라 (무늬 없이 색만). 아래에서만 보이고, 멀리서 내려다볼 땐 투명
function ceiling(cx, cz, wd, dp) {
  const c = new THREE.Mesh(new THREE.PlaneGeometry(wd, dp), new THREE.MeshBasicMaterial({ color: LAVENDER })); c.rotation.x = Math.PI / 2; c.position.set(cx, WALL_H, cz); scene.add(c);
}
const crystalM = new THREE.MeshBasicMaterial({ color: 0xfff6e8, transparent: true, opacity: 0.85 }), flameM = new THREE.MeshBasicMaterial({ color: 0xffe08a });
function chandelier(x, z, k = 1) { // 금색 샹들리에: 사슬 + 두 단 고리 + 촛불 + 크리스털
  const g = new THREE.Group(); g.position.set(x, WALL_H, z); g.scale.setScalar(k); scene.add(g);
  block(0.06, 1.2, 0.06, GOLD, 0, -0.6, 0, g); block(0.5, 0.12, 0.5, GOLD, 0, -0.06, 0, g);

  $('pamList').innerHTML = by.size ? [...by].map(([name, idx]) => `<div class="artist"><b>${esc(name)} 작가 ${here.has(name.trim()) ? '<span class="here">🟢 지금 전시장에 있어요</span>' : ''}</b>${idx.map(i => `<button data-i="${i}">🖼 ${esc(slots[i].a.title || '제목 없음')}</button>`).join('')}</div>`).join('') : '아직 전시된 작품이 없어요';
  $('pamList').querySelectorAll('button').forEach(b => b.onclick = () => { $('pam').classList.remove('on'); visit(slots[+b.dataset.i]); });
}

// ── 방명록 ──
function modal(html) { $('modalCard').innerHTML = html; $('modal').classList.remove('hide'); }
const closeModal = () => $('modal').classList.add('hide');
const noteHtml = rows => `<div class="notes">${rows.map((r, i) => `<div class="note" style="background:${['#fff3b0', '#ffd6e0', '#d8f3dc', '#cde7ff'][i % 4]}">${esc(r.text)}<small>- ${esc(r.name)}</small></div>`).join('') || '<p>아직 남긴 글이 없어요</p>'}</div>`;
function showBoard() {
  modal(`<h1>💌 방명록</h1>${noteHtml(gbRows)}<div class="stack"><button class="main" id="gbWrite">나도 남기기</button><button id="gbClose">닫기</button></div>`);
  $('gbWrite').onclick = () => writeGuestbook(false); $('gbClose').onclick = closeModal;
}
function writeGuestbook(leaving) {
  modal(`<h1>💌 방명록</h1><p>${leaving ? '나가기 전에 한마디 남겨 주세요!' : '작가들에게 한마디 남겨 주세요'}</p><textarea id="gbText" rows="3" maxlength="80" placeholder="예) 김하늘 작가님 고양이 이모티콘 최고예요!"></textarea>
    <div class="stack"><button class="main" id="gbSend">${leaving ? '남기고 나가기' : '남기기'}</button>${leaving ? '<button id="gbSkip">그냥 나가기</button>' : ''}<button id="gbBack">${leaving ? '더 둘러볼래요' : '닫기'}</button></div>`);
  $('gbText').focus();
  $('gbSend').onclick = async () => {
    const text = $('gbText').value.trim(); if (!text) return toast('한마디 적어 주세요');
    try { await Guestbook.add(my.name, text); } catch (e) { console.error(e); return toast('저장이 안 됐어요. 다시 눌러 주세요'); }
    net.send({ t: 'gb' }); await loadBoard(); toast('💌 고마워요!');
    leaving ? leave() : closeModal();
  };
  if (leaving) $('gbSkip').onclick = leave;
  $('gbBack').onclick = closeModal;
}
function leave() {
  net.leave(); stopMusic(); removeAvatar(ME); me = null;
  modal(`<h1>관람해 주셔서 고마워요 🎨</h1><p>${esc(my.name)}님, 또 와 주세요!</p><div class="stack"><a href="cinema.html${esc(location.search)}"><button class="main" style="width:100%">🎬 영화관 가기</button></a><button onclick="location.reload()">다시 입장하기</button></div>`);
}
$('exitBtn').onclick = () => writeGuestbook(true);

// ── 화면 누르기 ──
function needTicket() { if (my.ticket) return false; toast('🎫 왼쪽 리셉션에서 지배인에게 관람 티켓을 먼저 받아 주세요'); return true; }
function askTicket() {
  if (my.ticket) return modal(`${ticketHtml()}<div class="stack"><button class="main" id="tkOk">닫기</button></div>`), $('tkOk').onclick = closeModal;
  modal(`<h1>🛎 리셉션</h1><p>어서 오세요, ${esc(galleryName())}입니다.<br>관람 티켓을 받겠습니까?</p><div class="stack"><button class="main" id="tkYes">네, 받을게요</button><button id="tkNo">아니요</button></div>`);
  $('tkNo').onclick = closeModal;
  $('tkYes').onclick = () => { closeModal(); goTo(clampIn(DESK.x + 1.7, DESK.z), () => {
    me.root.rotation.y = -Math.PI / 2; my.ticket = true; track(); dingSound();
    const boss = avatars.get('concierge'); if (boss) say(boss, '즐거운 관람 되십시오 🎩', 3);
    modal(`<h1>🎫 관람 티켓이 나왔어요</h1>${ticketHtml()}<p>이제 아치 입구로 들어가 작품을 감상해요.</p><div class="stack"><button class="main" id="tkOk">고마워요</button></div>`); $('tkOk').onclick = closeModal;
  }); };
}
const ticketNo = String(Math.floor(Math.random() * 9000) + 1000);
function ticketHtml() {
  return `<div class="gticket"><div class="sm">ADMIT ONE · GALLERY TICKET</div><div class="ln"><i></i><b>◆</b><i></i></div><div class="big">${esc(galleryName())}</div><div class="ln"><i></i><b>◆</b><i></i></div><div class="sm">우리반 첫 전시회 · ${today}</div><div class="who">관람객 ${esc(my.name)} 님 · No.${ticketNo}</div></div>`;
}
onTap(ray => {
  if (!me || snapping) return;
  let hit = ray.intersectObjects(artMeshes)[0];
  if (hit) return zoom(hit.object.userData.art);
  hit = ray.intersectObjects(taps)[0];
  if (hit && hit.object.userData.tap === 'ticket') return askTicket();
  if (hit && hit.object.userData.tap === 'guestbook') return showBoard();
  if (hit && hit.object.userData.tap === 'bench') {
    if (ribbonClosed()) return toast('🎀 곧 개막해요! 테이프 커팅을 기다려 주세요');
    if (needTicket()) return;
    const b = benches[hit.object.userData.bench], seat = { x: b.x, z: +(b.z + Math.max(-1.1, Math.min(1.1, hit.point.z - b.z))).toFixed(2), rot: b.rot };
    return goTo({ x: seat.x, z: seat.z }, () => toast('🪑 앉아서 감상해요. 바닥을 누르면 일어나요'), seat);
  }
  if (hit && hit.object.userData.tap === 'flowers') {
    if (my.flower) return toast('💐 이미 꽃다발을 들고 있어요');
    return goTo(clampIn(-3.5, zF - 2), () => { me.root.rotation.y = Math.PI; my.flower = true; setHeld(me, held(my)); setFlower(me, true); track(); toast('💐 꽃다발을 두 손으로 안았어요!'); });
  }
  hit = ray.intersectObjects(floors)[0];
  if (!hit) return;
  if (ribbonClosed() && hit.point.z < LOBBY) toast('🎀 곧 개막해요! 테이프 커팅을 기다려 주세요');
  else if (hit.point.z < zH && needTicket()) return;
  goTo(clampIn(hit.point.x, hit.point.z));
});

// ── 은은한 음악: 관리자가 넣은 mp3, 없으면 파헬벨 캐논 화음을 코드로 연주 ──
let musicOn = true, synthTimer = null, musicOut = null;
const CANON = [[62, 66, 69], [57, 61, 64], [59, 62, 66], [54, 57, 61], [55, 59, 62], [50, 54, 57], [55, 59, 62], [57, 61, 64]];
function note(a, midi, t, len, vol) {
  const o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(musicOut); o.start(t); o.stop(t + len + 0.05);
}
function startSynth() {
  const a = audio();
  if (!musicOut) {
    musicOut = a.createGain(); musicOut.gain.value = 0.5;
    const d = a.createDelay(), fb = a.createGain(); d.delayTime.value = 0.33; fb.gain.value = 0.3;
    musicOut.connect(a.destination); musicOut.connect(d); d.connect(fb).connect(d); d.connect(a.destination);
  }
  let bar = 0, next = a.currentTime + 0.1;
  const play = () => { while (next < a.currentTime + 1) { const ch = CANON[bar % 8], t = next; note(a, ch[0] - 12, t, 2.2, 0.05); [0, 1, 2, 1].forEach((k, i) => note(a, ch[k] + (bar % 16 >= 8 && i === 3 ? 12 : 0), t + i * 0.5, 1.2, 0.04)); bar++; next += 2; } };
  play(); synthTimer = setInterval(play, 400);
}
function startMusic() {
  if (settings.gallery_music) { const b = $('bgm'); b.src = settings.gallery_music; b.volume = 0.35; b.play().catch(() => { toast('음악을 틀 수 없어 기본 음악으로 바꿔요'); startSynth(); }); }
  else startSynth();
}
function stopMusic() { $('bgm').pause(); clearInterval(synthTimer); synthTimer = null; }
$('musicBtn').onclick = () => { musicOn = !musicOn; $('musicBtn').textContent = musicOn ? '🎵' : '🔇'; musicOn ? startMusic() : stopMusic(); };

// ── 입장 ──
async function load() {
  try { [arts, settings] = await Promise.all([DB.list('artworks'), DB.settings()]); arts = await Portfolio.merge('artworks', arts, settings); } catch (e) { console.error(e); toast('작품 목록을 못 불러왔어요'); }
  document.title = galleryName(); document.querySelector('#pam h2').textContent = galleryName(); document.querySelector('#enter h1').textContent = '🖼 ' + galleryName();
  if (settings.open_gallery === 'off') $('enterNote').textContent = '🔒 오픈 준비 중이에요. 선생님이 열면 들어올 수 있어요.';
  H = buildHall(arts); renderPamphlet(); applyRibbon(false); loadBoard(); setPhotoBg(settings.gallery_photo_bg);
}
const ready = load();
setInterval(async () => { // 리본이 걸려 있는 동안만 개막을 확인해요
  if (!ribbonClosed()) return;
  try { settings = await DB.settings(); applyRibbon(true); } catch {}
}, 4000);
$('nameIn').addEventListener('keydown', e => e.key === 'Enter' && $('enterBtn').click());
$('enterBtn').onclick = async () => {
  const typed = $('nameIn').value.trim().slice(0, 10), teacher = typed === TEACHER_CODE, name = teacher ? TEACHER_NAME : typed;
  if (!name) return toast('이름을 적어 주세요');
  if (!teacher) try { localStorage.setItem('oname', name); } catch {}
  audio(); await ready; // 아이패드: 버튼을 누른 순간에 소리를 깨워 둬요
  try { settings = { ...settings, ...(await DB.settings()) }; } catch {} // 관리자가 방금 열었을 수도 있어서 최신으로
  if (settings.open_gallery === 'off' && !teacher) return toast('🔒 미술관은 오픈 준비 중이에요. 조금만 기다려 주세요!', 3500);
  startMusic();
  ['enter'].forEach(i => $(i).classList.add('hide')); ['bottom', 'pamBtn', 'corner'].forEach(i => $(i).classList.remove('hide'));
  const ch = Math.floor(Math.random() * PRESETS.length), sx = 1 + Math.random() * 3, sz = zF - 1.2;
  me = avatarFor(ME, ch, name, teacher); place(me, sx, sz); me.root.rotation.y = Math.PI;
  my = { name, ch, x: sx, z: sz, joined: Date.now(), flower: false, ticket: teacher, teacher }; setHeld(me, held(my));
  net = joinRoom(ME, onPeople, onEvent, 'gallery'); track();
  toast(isArtist(name) ? `🎨 ${name} 작가님, 환영해요! 🛎 리셉션에서 티켓을 받고 💐 꽃다발도 하나 들고 가요` : '🛎 왼쪽 리셉션에서 티켓을 받고, 💐 꽃다발도 하나 들고 가요', 5000);
};
$('clapBtn').onclick = () => { if (!me) return; say(me, '👏👏👏', 2.5); me.clapT = 1.2; clapSound(); net.send({ t: 'clap', id: ME }); };
$('pamBtn').onclick = () => $('pam').classList.toggle('on');

let last = performance.now();
cam.pitch = 0.42; cam.dist = 10;
renderer.setAnimationLoop(t => {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  for (const av of avatars.values()) updateAvatar(av, dt);
  if (confetti) for (const m of confetti) { m.position.y = Math.max(0.02, m.position.y - m.userData.v * dt); m.rotation.x += dt * 4; m.rotation.y += dt * 3; }
  if (me) $('snapBtn').classList.toggle('hide', !(zoneAt(me.root.position) >= 0 && !me.path.length));
  updateCamera(me ? me.root.position : { x: 0, z: zF - 4 });
  renderer.render(scene, camera);
  if (wantSnap) { const info = wantSnap; wantSnap = null; finishSnap(renderer.domElement.toDataURL('image/png'), info); } // 그린 직후라서 그대로 찍혀요
});
</script>
